name: scorecard

on:
  schedule:
    - cron: "0 3 * * 1"
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: scorecard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analysis:
    name: OSSF Scorecard
    permissions:
      id-token: write # Authenticate the optional Scorecard result publication.
      contents: read
      actions: read # Read workflow metadata for Scorecard analysis.
    uses: NDDev-Technocracy-Archive/ci-workflows-20261014/.github/workflows/public-scorecard-json.yml@b74df9f52fe68d62860e6058a6701536c3cd5a55 # commit:b74df9f52fe68d62860e6058a6701536c3cd5a55
    with:
      # Public repo: pull_request runs untrusted fork code. Pin the hosted runner
      # explicitly — the reusable's `runner` default belongs to the pinned commit,
      # not to this repository, so inheriting it would let a pin bump move fork
      # PRs onto trusted private infrastructure with no diff here to review.
      runner: ubuntu-latest
      publish_results: false
