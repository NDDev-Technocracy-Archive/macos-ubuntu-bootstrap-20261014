name: PR hygiene

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

permissions: {}

concurrency:
  group: pr-hygiene-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-hygiene:
    name: PR hygiene
    permissions:
      contents: read
      pull-requests: write # labeler + stale jobs comment/label PRs
      issues: write # stale job manages issues
    uses: NDDev-Technocracy-Archive/ci-workflows-20261014/.github/workflows/pr-hygiene.yml@eb41cf80c18110781ef5aa400109a7359f9cba9c # commit:b74df9f52fe68d62860e6058a6701536c3cd5a55
    # This reusable exposes no `runner` input at the pinned commit; the
    # hosted-runner rule therefore does not apply here. Re-check on a pin bump.
    with:
      # The reusable commitlint job (wagoid v6.2.1) fails with EISDIR here; keep
      # pr-title/labeler/stale and re-enable once ci-workflows fixes commitlint.
      commitlint: false
